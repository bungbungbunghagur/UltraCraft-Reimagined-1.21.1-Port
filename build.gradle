plugins {
    id 'dev.architectury.loom' version '1.10-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

loom {
    // the mixin configs name this refmap; without it the name follows the jar's (UltraCraft-Reimagined), which they
    // don't find ("No refMap loaded": every mixin by an obfuscated name fails outside the dev run)
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "UltraCraft-refmap.json"
    }
    runs {
        client {
            programArgs "--quickPlaySingleplayer", "New World", "--width", "2560", "--height", "1440"
        }
    }
}

repositories {
    maven { url "https://maven.neoforged.net/releases/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered {
        it.mappings("net.fabricmc:yarn:${project.yarn_mappings}:v2")
        it.mappings("dev.architectury:yarn-mappings-patch-neoforge:${project.yarn_mappings_patch_neoforge}")
    }
    neoForge "net.neoforged:neoforge:${project.neoforge_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/neoforge.mods.toml") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// The setup's payload: the mod jar without anything built from ULTRAKILL (the git-ignored resource folders), which the
// setup rebuilds from the player's own install and adds back (installer/build_package.py ships this one)
tasks.register('codeJar', Zip) {
    dependsOn remapJar
    archiveFileName = "UltraCraft-Reimagined-${project.version}-code.jar"
    destinationDirectory = layout.buildDirectory.dir("libs")
    from(zipTree(remapJar.archiveFile)) {
        exclude "assets/ultracraft/textures/uk/**", "assets/ultracraft/sounds/uk/**", "assets/ultracraft/models/uk/**",
            "assets/ultracraft/uk/**", "assets/ultracraft/sounds.json", "assets/ultracraft/font/*.ttf"
    }
}
